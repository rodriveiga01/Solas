name: Release

# Every push to main ships a new release with a .dmg.
# Versioning: first release is v1.0.0, then auto patch-bump
# (v1.0.1, v1.0.2, ...) from the highest existing v1.* tag.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select newest Xcode (Swift 6+)
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)/Contents/Developer"
          swift --version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Package Solas.app
        run: sh scripts/package.sh

      - name: Build .dmg (drag-to-Applications)
        run: |
          STAGE="$(mktemp -d)"
          cp -R Solas.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname Solas -srcfolder "$STAGE" -ov -format UDZO Solas.dmg
          ls -lh Solas.dmg

      - name: Compute next version (first release is v1.0.0)
        id: version
        run: |
          LAST="$(git tag -l 'v1.*' | sort -V | tail -n 1)"
          if [ -z "$LAST" ]; then
            NEXT="v1.0.0"
          else
            PATCH="$(echo "$LAST" | awk -F. '{print $NF}')"
            NEXT="v1.0.$((PATCH + 1))"
          fi
          echo "tag=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next tag: $NEXT (last: ${LAST:-none})"

      - name: Create GitHub Release with .dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "Solas ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            Solas.dmg
